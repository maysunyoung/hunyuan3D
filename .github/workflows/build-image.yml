name: Build and Push RunPod Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: "2.1"
      registry:
        description: Where to push (ghcr = GitHub Container Registry, 推荐)
        required: true
        default: ghcr
        type: choice
        options:
          - ghcr
          - dockerhub

env:
  IMAGE_NAME: runpod-hunyuan3d

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Extra prune
        run: |
          set -eux
          sudo rm -rf /opt/hostedtoolcache /usr/share/swift /usr/local/lib/android || true
          sudo docker system prune -af || true
          df -h

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to GHCR
        if: github.event.inputs.registry == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event.inputs.registry == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ "${{ github.event.inputs.registry }}" = "ghcr" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            BASE="ghcr.io/${OWNER}/${{ env.IMAGE_NAME }}"
          else
            BASE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          fi
          echo "tags=${BASE}:${TAG},${BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "primary=${BASE}:${TAG}" >> "$GITHUB_OUTPUT"

      # No GHA layer cache — it doubles disk usage and OOMs this image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false

      - name: Summary
        run: |
          echo "### Image ready" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.primary }}\`" >> "$GITHUB_STEP_SUMMARY"
